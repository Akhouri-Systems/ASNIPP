<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="ASNIPP - The Windows Snipping Tool Killer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b10"/>
      <stop offset="0.55" stop-color="#10121d"/>
      <stop offset="1" stop-color="#0a1830"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.8" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#ff453a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff453a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7cc0ff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="240%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowBlue)"/>
  <rect width="1200" height="420" rx="28" fill="url(#glowRed)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- Title -->
  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="8" fill="url(#title)">ASNIPP</text>
  <text x="600" y="206" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="600" fill="#ffffff" fill-opacity="0.85">The Windows Snipping Tool Killer</text>
  <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" fill="#ffffff" fill-opacity="0.5">Capture  ·  Record  ·  Draw  ·  Pin  ·  Edit   —   from one floating pill</text>

  <!-- Dynamic island pill -->
  <g filter="url(#shadow)">
    <rect x="270" y="278" width="660" height="82" rx="41" fill="url(#pill)"/>
    <rect x="270.5" y="278.5" width="659" height="81" rx="40.5" fill="none" stroke="url(#rim)"/>
  </g>

  <!-- Pill buttons -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="600" fill="#ffffff">
    <rect x="298" y="299" width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="312" y="313" width="18" height="13" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="321" cy="319.5" r="3.4" fill="#fff"/>
    <text x="342" y="325">Photo</text>

    <rect x="440" y="299" width="132" height="40" rx="20" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="454" y="313" width="14" height="13" rx="3" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M472 316 L480 312 L480 327 L472 323 Z" fill="#fff"/>
    <text x="488" y="325">Video</text>

    <rect x="582" y="299" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="596" y="313" width="20" height="13" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M602 331 H610" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="626" y="325">Screen</text>

    <line x1="744" y1="304" x2="744" y2="334" stroke="#fff" stroke-opacity="0.15"/>

    <circle cx="780" cy="319" r="19" fill="#ffffff" fill-opacity="0.10"/>
    <path d="M771 328 L772 322 L783 311 L788 316 L777 327 Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="828" cy="319" r="19" fill="#ffffff" fill-opacity="0.10"/>
    <circle cx="828" cy="319" r="8" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="828" cy="319" r="2.6" fill="#0a84ff"/>
    <circle cx="876" cy="319" r="19" fill="#ff453a"/>
    <circle cx="876" cy="319" r="5.5" fill="#fff"/>
  </g>

  <!-- Version tag -->
  <text x="600" y="396" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" letter-spacing="3" fill="#ffffff" fill-opacity="0.35">AN AKHOURI SYSTEMS PRODUCT   ·   v1.0.0</text>
</svg>
